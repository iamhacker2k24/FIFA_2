<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>DTV HINDI LIVE STREAM | HD Sports Portal</title>
  
  <script src="/security.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Glassmorphism & Animations */
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    .glass-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .glass-btn:active {
      transform: scale(0.95);
    }
    /* Active State Style */
    .active-channel {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.15)) !important;
      border: 1px solid rgba(52, 211, 153, 0.6) !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      transform: scale(0.98);
    }
    body {
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Loading Spinner */
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-left-color: #10b981;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-10">

  <!-- Header -->

        <i class="fas fa-home"></i>

            LIVE

        <div class="flex items-center gap-2">

            <i class="fas fa-bolt text-emerald-400"></i>
            <span class="hidden sm:inline">Auto-Play Active</span>
          </button>

          <!-- Popout to New Window -->
          <button id="btn-popout" class="p-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs cursor-pointer transition-all flex items-center gap-1" title="Open Stream in New Window">
            <i class="fas fa-external-link-alt"></i>
            <span class="hidden sm:inline text-[11px]">New Tab</span>
          </button>
        </div>
      </div>

      <!-- Video Loader -->
      <div id="player-loader" class="absolute inset-0 z-20 bg-black/80 flex flex-col items-center justify-center transition-opacity duration-300 pointer-events-none opacity-0">
        <div class="loader mb-2"></div>
        <span class="text-xs text-slate-300 font-medium">Loading live broadcast...</span>
      </div>

      <!-- Iframe Video Player with full Autoplay & DRM permissions -->
      <div class="aspect-video w-full bg-black rounded-xl overflow-hidden shadow-2xl relative">
        <iframe 
          id="videoPlayer" 
          src="/aioplayer.html?id=162"

          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
          allowfullscreen 
          class="w-full h-full object-cover">
        </iframe>
      </div>
    </div>

    <!-- Quick Channel Selector & Channel Count -->
    <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="p-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-sm">
          <i class="fas fa-tv"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-white">Live Sports Channels</h2>

        </div>
      </div>

      <!-- Search Input -->
      <div class="relative w-full sm:w-64">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input 
          id="channel-search"

        />
      </div>
    </div>

    <!-- Live Channel Grid -->

        <!-- Rendered dynamically -->
      </div>
    </div>

  </main>

    let currentActiveIndex = 0;
    const videoPlayer = document.getElementById('videoPlayer');
    const playerTitle = document.getElementById('player-title');
    const playerLoader = document.getElementById('player-loader');
    const channelGrid = document.getElementById('channel-grid');
    const searchInput = document.getElementById('channel-search');
    const btnPopout = document.getElementById('btn-popout');
    const btnForceAutoplay = document.getElementById('btn-force-autoplay');
    const statusBadge = document.getElementById('status-badge');

    function playChannel(index) {
      if (index < 0 || index >= channelList.length) return;
      const channel = channelList[index];
      currentActiveIndex = index;

      playerLoader.style.opacity = '1';
      playerTitle.textContent = channel.name;
      document.getElementById('current-channel-name-header').textContent = channel.name;

      videoPlayer.src = channel.url;

      // Update active highlight on buttons
      document.querySelectorAll('.channel-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active-channel');
        } else {
          btn.classList.remove('active-channel');
        }
      });

      setTimeout(() => {
        playerLoader.style.opacity = '0';
      }, 700);
    }

    function renderChannels(filterText = '') {
      channelGrid.innerHTML = '';
      const text = filterText.toLowerCase().trim();

      channelList.forEach((channel, index) => {
        if (text && !channel.name.toLowerCase().includes(text)) {
          return;
        }

        const btn = document.createElement('button');
        btn.className = `channel-btn glass-btn text-left p-3 rounded-xl flex items-center justify-between group relative overflow-hidden transition-all duration-300 hover:bg-white/10 ${index === currentActiveIndex ? 'active-channel' : ''}`;
        btn.id = `btn-${index}`;
        
        btn.onclick = () => {
          playChannel(index);
        };

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${channel.image}" alt="" class="w-10 h-10 rounded-full object-cover border border-white/10 group-hover:border-emerald-400/50 transition-colors bg-slate-900" onerror="this.src='/favicon.svg'"/>
            <div class="flex flex-col">
              <span class="font-bold text-xs sm:text-sm text-gray-200 group-hover:text-white line-clamp-1">${channel.name}</span>
              <span class="text-[10px] text-emerald-400 flex items-center gap-1 font-semibold">
                <i class="fas fa-play text-[8px]"></i> Auto-Play Feed
              </span>
            </div>
          </div>
          <button class="popout-single p-2 text-slate-400 hover:text-white rounded-lg hover:bg-white/10" title="Open in new window" onclick="event.stopPropagation(); window.open('${channel.url}', '_blank');">
            <i class="fas fa-external-link-alt text-xs"></i>
          </button>
        `;

        channelGrid.appendChild(btn);
      });
    }

    // New Window Popout Handler
    btnPopout.addEventListener('click', () => {
      const activeUrl = channelList[currentActiveIndex]?.url || '/aioplayer.html?id=162';
      window.open(activeUrl, '_blank', 'noopener,noreferrer');
    });

    // Force Autoplay Trigger
    btnForceAutoplay.addEventListener('click', () => {
      playChannel(currentActiveIndex);
    });

    // Filter Search
    searchInput.addEventListener('input', (e) => {
      renderChannels(e.target.value);
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const reqId = params.get('id') || params.get('channel') || params.get('ch');
      
      let initIndex = 0;
      if (reqId) {
        const found = channelList.findIndex(c => c.url.includes(`id=${reqId}`) || c.name.toLowerCase().includes(reqId.toLowerCase()));
        if (found !== -1) initIndex = found;
      }

      renderChannels();
      playChannel(initIndex);
    });
